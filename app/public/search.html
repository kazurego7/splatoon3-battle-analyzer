<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08101b" />
    <title>試合検索 | Splatoon Battle Review</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./search.css" />
  </head>
  <body class="search-page" data-screen="search">
    <header class="search-header">
      <button class="app-menu-button" type="button" data-navigation-toggle aria-label="メニューを開く"><span></span><span></span><span></span></button>
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><h1>試合検索</h1></div></div>
    </header>

    <main class="search-main">
      <section class="filter-workspace compact-filter-workspace" aria-label="試合の検索条件">
        <div class="filter-heading"><div><span>基本検索</span><strong>項目を開いてアイコンを複数選択</strong></div><button id="reset-search" type="button">すべて解除</button></div>
        <div class="filter-launchers">
          <button type="button" class="filter-launcher" data-filter-open="stages"><i>01</i><span><strong>ステージ</strong><small id="stage-selection-summary">すべて</small></span><b id="stage-selection-count" hidden>0</b><span id="stage-selection-preview" class="selection-preview"></span><em>›</em></button>
          <button type="button" class="filter-launcher" data-filter-open="rules"><i>02</i><span><strong>ルール</strong><small id="rule-selection-summary">すべて</small></span><b id="rule-selection-count" hidden>0</b><span id="rule-selection-preview" class="selection-preview"></span><em>›</em></button>
          <button type="button" class="filter-launcher" data-filter-open="selfWeapons"><i>03</i><span><strong>自分のブキ</strong><small id="self-weapon-selection-summary">すべて</small></span><b id="self-weapon-selection-count" hidden>0</b><span id="self-weapon-selection-preview" class="selection-preview"></span><em>›</em></button>
          <button type="button" class="filter-launcher" data-filter-open="opponentWeapons"><i>04</i><span><strong>相手のブキ</strong><small id="opponent-weapon-selection-summary">すべて</small></span><b id="opponent-weapon-selection-count" hidden>0</b><span id="opponent-weapon-selection-preview" class="selection-preview"></span><em>›</em></button>
        </div>
        <div id="active-search-filters" class="active-search-filters" aria-live="polite"></div>
      </section>

      <section class="result-section">
        <header><div><p>SEARCH RESULTS</p><h2>該当する試合</h2></div><div class="result-summary"><strong id="result-count">—</strong><span id="total-count">試合を読込中</span></div></header>
        <div id="search-results" class="search-results"></div>
        <div id="search-empty" class="search-empty" hidden><i>⌕</i><h2>条件に合う試合がありません</h2><p>選択を減らすか、別の組み合わせを試してください。</p></div>
      </section>
    </main>

    <dialog id="filter-dialog" class="filter-dialog">
      <div class="filter-dialog-card">
        <header><div><p>SELECT FILTER</p><h2 id="filter-dialog-title">条件を選択</h2><span id="filter-dialog-description">アイコンを複数選択できます</span></div><button id="close-filter-dialog" type="button" aria-label="閉じる">×</button></header>
        <label class="filter-option-search"><span>⌕</span><input id="filter-option-query" type="search" placeholder="名前で絞り込む" autocomplete="off" /></label>
        <div id="weapon-type-tabs" class="weapon-type-tabs" role="tablist" aria-label="ブキ種" hidden></div>
        <div id="stage-options" class="icon-options stage-options filter-option-panel" data-filter-panel="stages"></div>
        <div id="rule-options" class="icon-options rule-options filter-option-panel" data-filter-panel="rules"></div>
        <div id="self-weapon-options" class="icon-options weapon-options filter-option-panel" data-filter-panel="selfWeapons"></div>
        <div id="opponent-weapon-options" class="icon-options weapon-options filter-option-panel" data-filter-panel="opponentWeapons"></div>
        <footer><button id="clear-current-filter" type="button">この項目を解除</button><button id="apply-filter-dialog" type="button">選択を完了</button></footer>
      </div>
    </dialog>
    <script type="module" src="./navigation.js"></script>
    <script type="module" src="./search.js"></script>
  </body>
</html>
